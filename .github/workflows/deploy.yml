name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build inner-site (OS)
        working-directory: portfolio/portfolio-inner-site
        run: |
          npm ci
          npm run build

      - name: Install and build portfolio-website (3D scene)
        working-directory: portfolio/portfolio-website
        run: |
          npm install
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/os
          cp -r portfolio/portfolio-website/public/. _site/
          cp -r portfolio/portfolio-inner-site/build/. _site/os/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
